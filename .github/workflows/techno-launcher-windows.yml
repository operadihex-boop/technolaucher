
name: Build Techno Launcher (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fetch required NBT library
        shell: pwsh
        run: |
          if (-not (Test-Path "libraries/libnbtplusplus/CMakeLists.txt")) {
            git clone --depth 1 https://github.com/PrismLauncher/libnbtplusplus.git libraries/libnbtplusplus
          }

      - name: Set up dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: TechnoLauncher-Windows-x64
          vcvars-arch: amd64
          qt-version: 6.10.2

      - name: Configure
        shell: pwsh
        run: >-
          cmake --preset windows_msvc
          -DLauncher_APP_BINARY_NAME=TechnoLauncher
          -DLauncher_CURSEFORGE_API_KEY=
          -DLauncher_UPDATER_GITHUB_REPO=
          -DLauncher_BUG_TRACKER_URL=
          -DLauncher_NEWS_RSS_URL=
          -DLauncher_NEWS_OPEN_URL=
          -DLauncher_WIKI_URL=
          -DLauncher_HELP_URL=

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows_msvc --config Release --parallel

      - name: Install portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/TechnoLauncher -Force | Out-Null
          cmake --install build --config Release --prefix dist/TechnoLauncher
          Compress-Archive -Path dist/TechnoLauncher/* -DestinationPath dist/TechnoLauncher-windows-x64.zip -CompressionLevel Optimal

      - name: Upload Techno Launcher
        uses: actions/upload-artifact@v7
        with:
          name: TechnoLauncher-windows-x64
          path: dist/TechnoLauncher-windows-x64.zip
          if-no-files-found: error
